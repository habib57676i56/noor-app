name: Build Noor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Noor APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Noor.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Noor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: Noor.apk

      - name: Publish Direct APK Download in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOOR - نور (Android APK)"
          body: "اضغط على ملف Noor.apk بالأسفل لتحميل وتثبيت تطبيق نور مباشرة على هاتفك الأندرويد."
          files: Noor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
